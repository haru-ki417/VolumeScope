name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # 画面（WPF）も含めて、実際に使う Windows で確かめる
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VolumeScope.slnx

      - name: Build
        run: dotnet build VolumeScope.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution VolumeScope.slnx --configuration Release --no-build
