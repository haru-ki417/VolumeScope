name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # 画面（WPF）と計算の部品を、実際に使う Windows で確かめる
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/VolumeScope.App --configuration Release

      - name: Test
        run: dotnet test --project tests/VolumeScope.Tests --configuration Release

  web:
    # ブラウザー版（Blazor WebAssembly）がビルドできるかを確かめる
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build src/VolumeScope.Web --configuration Release
